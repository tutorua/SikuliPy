[project]
name = "sikulipy"
version = "0.1.0"
description = "SikuliPy - Pure Python visual testing IDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyqt6>=6.0",
    "opencv-python>=4.0",
    "pytesseract>=0.3",
    "pyautogui>=0.9",
    "playwright>=1.40",
    "numpy>=1.24",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-playwright>=0.4",
]
